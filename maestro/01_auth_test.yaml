appId: com.warehouse.box_management_system
---
# ==============================================================================
# PENGUJIAN 1: AUTENTIKASI & FORM LOGIN (TC-AUTH-01 s/d TC-AUTH-05)
# Menjalankan validasi input, boundary test, dan autentikasi Supabase
# ==============================================================================

# 1. Bersihkan status dan buka aplikasi
- launchApp:
    clearState: true

# 2. Pastikan Layar Login Terbuka
- assertVisible: "MyWarehouse"
- assertVisible: "Warehouse Inventory & QR Tracking System"
- assertVisible: "Masuk ke Sistem"

# ------------------------------------------------------------------------------
# A. Validasi Field Kosong (Negative Test)
# ------------------------------------------------------------------------------
- tapOn: "Masuk Sekarang"
- assertVisible: "Email wajib diisi"
- assertVisible: "Kata sandi wajib diisi"

# ------------------------------------------------------------------------------
# B. Validasi Format Email Tidak Valid (Negative Test)
# ------------------------------------------------------------------------------
- tapOn: "nama@perusahaan.com, Email wajib diisi"
- inputText: "petugasgudang"
- tapOn: "Minimal 6 karakter, Kata sandi wajib diisi"
- inputText: "warehouse123"
- tapOn: "Masuk Sekarang"
- assertVisible: "Format email tidak valid"

# ------------------------------------------------------------------------------
# C. Validasi Password Kurang dari 6 Karakter (Boundary Test)
# ------------------------------------------------------------------------------
- tapOn: "petugasgudang"
- eraseText
- inputText: "admin@gudang.com"
- tapOn: "••••••••••••"
- eraseText
- inputText: "12345"
- tapOn: "Masuk Sekarang"
- assertVisible: "Kata sandi minimal 6 karakter"

# ------------------------------------------------------------------------------
# C. Validasi Password Kurang dari 6 Karakter (Boundary Test)
# ------------------------------------------------------------------------------
- tapOn: "admin@gudang.com"
- eraseText
- inputText: "ismlfkrn21@gmail"
- tapOn: "•••••"
- eraseText
- inputText: "210904"
- tapOn: "Masuk Sekarang"
- assertVisible: "Selamat datang kembali!"


# Verifikasi Berhasil Masuk ke Beranda Katalog Box
- assertVisible: "Katalog Box Gudang\nismlfkrn21@gmail.com"
- assertVisible: "Total Jenis"
- assertVisible: "Total Unit"
- takeScreenshot: screenshots/01_auth_success
