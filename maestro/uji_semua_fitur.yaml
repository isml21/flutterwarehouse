appId: com.warehouse.box_management_system
---
# ==============================================================================
# PENGUJIAN SEMUA FITUR (FULL END-TO-END SUITE)
# Menjalankan seluruh siklus pengujian dari awal hingga akhir:
# 1. Autentikasi & Form Login
# 2. Registrasi Box Baru & Kalkulasi Volume
# 3. Pencarian & Filter Katalog
# 4. Transaksi Stok Masuk & Stok Keluar
# 5. QR Code Scanner & Detail Box
# 6. Hapus Box (Batal & Eksekusi Permanen)
#
# Jalankan via CLI:
# maestro test maestro/uji_semua_fitur.yaml
# ==============================================================================

# 1. Bersihkan State & Uji Alur Login + Validasi Form (TC-AUTH-01 s/d TC-AUTH-05)
- runFlow: 01_auth_flow.yaml

# 2. Uji Registrasi Box Baru & Kalkulasi Volume (TC-BOX-01, TC-BOX-02)
- runFlow: 02_box_registration_flow.yaml

# 3. Uji Pencarian Box & Filter Kategori/Status (TC-BOX-03, TC-BOX-04)
- runFlow: 03_catalog_search_filter_flow.yaml

# 4. Uji Transaksi Stok Masuk (IN) & Stok Keluar (OUT) (TC-TRX-03, TC-TRX-04, TC-TRX-05)
- runFlow: 04_stock_transaction_flow.yaml

# 5. Uji Scanner QR & Modal Detail Box (TC-TRX-01, TC-TRX-02)
- runFlow: 05_qr_scanner_manual_flow.yaml

# 6. Uji Fitur Hapus Box & Validasi Pembatalan Hapus (TC-DEL-01, TC-DEL-02)
- runFlow: 06_delete_box_flow.yaml
