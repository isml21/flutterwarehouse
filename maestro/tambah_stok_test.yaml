appId: com.warehouse.box_management_system # Sesuaikan dengan App ID (di build.gradle.kts: com.warehouse.box_management_system)
---
- launchApp

# 1. Menekan Tombol Stock In / Out pada salah satu kartu box di katalog
- tapOn: "Stock In / Out"

# 2. Memastikan Tab 'Stock IN (Masuk)' dipilih
- tapOn: "Stock IN (Masuk)"

# 3. Menambahkan Jumlah Barang (Bisa menggunakan Quick Chip +10 atau tombol +)
- tapOn: "+10"

# 4. Menekan Tombol Konfirmasi Stock IN
- tapOn: ".*Konfirmasi Stock IN.*"

# 5. Memverifikasi Notifikasi Sukses
- assertVisible: ".*Berhasil mencatat Stock In.*"

# 6. Menutup BottomSheet Transaksi
- back
