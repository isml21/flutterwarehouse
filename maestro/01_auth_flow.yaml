appId: com.warehouse.box_management_system
---
# ==============================================================================
# TEST SCENARIO: TS-01 AUTENTIKASI (LOGIN & VALIDASI FORM)
# UAT Reference: TC-AUTH-01 s/d TC-AUTH-05
# ==============================================================================

- launchApp:
    clearState: true

# 1. Pastikan Halaman Login Terbuka
- assertVisible: "Sistem Manajemen Box"
- assertVisible: "Warehouse Inventory & QR Tracking System"
- assertVisible: "Masuk ke Sistem"

# ------------------------------------------------------------------------------
# TC-AUTH-02: Validasi Field Kosong (Negative Test)
# ------------------------------------------------------------------------------
- tapOn: "Masuk Sekarang"
- assertVisible: "Email wajib diisi"
- assertVisible: "Kata sandi wajib diisi"

# ------------------------------------------------------------------------------
# TC-AUTH-03: Validasi Format Email Tidak Valid (Negative Test)
# ------------------------------------------------------------------------------
- tapOn:
    hintText: "nama@perusahaan.com"
- inputText: "petugasgudang@"
- tapOn:
    hintText: "Minimal 6 karakter"
- inputText: "warehouse123"
- tapOn: "Masuk Sekarang"
- assertVisible: "Format email tidak valid"

# ------------------------------------------------------------------------------
# TC-AUTH-04: Validasi Password < 6 Karakter (Boundary Test)
# ------------------------------------------------------------------------------
- tapOn:
    hintText: "nama@perusahaan.com"
- eraseText
- inputText: "admin@gudang.com"
- tapOn:
    hintText: "Minimal 6 karakter"
- eraseText
- inputText: "12345"
- tapOn: "Masuk Sekarang"
- assertVisible: "Kata sandi minimal 6 karakter"

# ------------------------------------------------------------------------------
# TC-AUTH-05: Fitur Isi Akun Demo Cepat
# ------------------------------------------------------------------------------
- tapOn: "Isi Akun Demo Cepat"
- assertVisible: "Kredensial Demo terisi otomatis."

# ------------------------------------------------------------------------------
# TC-AUTH-01: Login Berhasil dengan Kredensial Valid (Positive Test)
# ------------------------------------------------------------------------------
- tapOn: "Masuk Sekarang"

# Verifikasi Berhasil Masuk ke Katalog Box Gudang
- assertVisible: "Katalog Box Gudang"
- assertVisible: "Total Jenis"
- assertVisible: "Total Unit"
- takeScreenshot: screenshots/01_auth_success
