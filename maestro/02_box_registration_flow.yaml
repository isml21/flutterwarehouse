appId: com.warehouse.box_management_system
---
# ==============================================================================
# TEST SCENARIO: TS-02 REGISTRASI BOX BARU & GENERATE QR CODE
# UAT Reference: TC-BOX-01, TC-BOX-02, TC-BOX-05
# ==============================================================================

# 1. Pastikan Petugas Sudah Login
- runFlow: subflows/login.yaml

# 2. Buka Layar Tambah Box Baru
- tapOn: "Tambah Box Baru"
- assertVisible: "Registrasi Box Baru"
- assertVisible: "Identitas Box Gudang"

# ------------------------------------------------------------------------------
# TC-BOX-02: Validasi Dimensi Nilai 0 (Boundary Test)
# ------------------------------------------------------------------------------
# Ubah panjang menjadi 0
- tapOn:
    below: "Panjang (L)"
- eraseText
- inputText: "0"

- scroll
- tapOn: "Simpan Box & Generate QR Code"
- assertVisible: "> 0"

# ------------------------------------------------------------------------------
# TC-BOX-01: Registrasi Box Baru dengan Data Valid & Auto-Code (Positive Test)
# ------------------------------------------------------------------------------
# Kembalikan ke atas
- scrollUntilVisible:
    element: "Kode Box (Unik)"
    direction: UP

# Tekan tombol 'Acak' untuk auto-generate kode box
- tapOn: "Acak"

# Isi Nama Box
- tapOn:
    hintText: "Misal: Kardus Kemasan Ekspor Medium"
- inputText: "Kardus Sparepart Heavy Duty"

# Perbaiki Dimensi Panjang, Lebar, Tinggi
- tapOn:
    below: "Panjang (L)"
- eraseText
- inputText: "40"

- tapOn:
    below: "Lebar (W)"
- eraseText
- inputText: "30"

- tapOn:
    below: "Tinggi (H)"
- eraseText
- inputText: "20"

# Verifikasi Perhitungan Volume Otomatis (40*30*20 / 1000 = 24.00 Liter)
- assertVisible: ".*24.00 Liter.*"

# Scroll ke Bagian Lokasi & Stok
- scrollUntilVisible:
    element: "Simpan Box & Generate QR Code"
    direction: DOWN

# Isi Lokasi Rak
- tapOn:
    hintText: "Misal: Rak A-02, Pallet 4, Bay 10"
- eraseText
- inputText: "Rak B-02"

# Isi Jumlah Stok Awal
- tapOn:
    below: "Jumlah Stok Awal (Unit)"
- eraseText
- inputText: "15"

# Simpan Box Baru
- tapOn: "Simpan Box & Generate QR Code"

# ------------------------------------------------------------------------------
# TC-BOX-05: Modal Dialog QR Code & Salin UUID
# ------------------------------------------------------------------------------
# Verifikasi Popup Dialog QR Code Otomatis Muncul
- assertVisible: "Warehouse QR Identifier"
- assertVisible: "Rak B-02"
- assertVisible: "Kardus Sparepart Heavy Duty"

# Ketuk UUID Box untuk Salin ke Clipboard
- tapOn: ".*UUID:.*"
- assertVisible: "UUID Box copied to clipboard!"

# Tutup Dialog QR Code
- takeScreenshot: screenshots/02_qr_dialog_success
- back

# Kembali ke Beranda Katalog Box
- assertVisible: "Katalog Box Gudang"
