appId: com.warehouse.box_management_system
---
# ==============================================================================
# PENGUJIAN 1 FITUR: HAPUS ITEM / BOX DARI SISTEM GUDANG (UAT-09 & UAT-10)
# Cocok dijalankan langsung di Maestro Studio maupun CLI:
# maestro test maestro/uji_satu_fitur_hapus.yaml
# ==============================================================================

# 1. Buka Aplikasi
- launchApp:
    clearState: false

# 2. Otomatis Login Jika Berada di Layar Masuk
- runFlow:
    when:
      visible: "Masuk Sekarang"
    commands:
      - tapOn: "Isi Akun Demo Cepat"
      - tapOn: "Masuk Sekarang"

# 3. Pastikan Berada di Layar Katalog Box Gudang
- assertVisible: "Katalog Box Gudang"

# ------------------------------------------------------------------------------
# SKENARIO A: Uji Tombol Batal (Pencegahan Kesalahan Hapus / Negatif)
# ------------------------------------------------------------------------------
# Ketuk ikon tong sampah pada kartu box pertama (index: 0)
- tapOn:
    text: "Hapus Item / Box"
    index: 0

# Verifikasi Modal Dialog Konfirmasi Glassmorphic Muncul
- assertVisible: "Hapus Box dari Sistem?"
- assertVisible: ".*permanen.*"

# Ketuk Tombol 'Batal'
- tapOn: "Batal"

# Verifikasi Dialog Tertutup dan Box Tetap Ada di Katalog
- assertNotVisible: "Hapus Box dari Sistem?"
- assertVisible: "Katalog Box Gudang"

# ------------------------------------------------------------------------------
# SKENARIO B: Konfirmasi Hapus Box Secara Permanen (Positif)
# ------------------------------------------------------------------------------
# Ketuk kembali ikon tong sampah pada kartu box pertama
- tapOn:
    text: "Hapus Item / Box"
    index: 0

# Verifikasi Dialog Muncul Kembali
- assertVisible: "Hapus Box dari Sistem?"

# Ketuk Tombol 'Hapus Box' di bawah teks peringatan
- tapOn:
    text: "Hapus Box"
    below: ".*permanen.*"

# Verifikasi Dialog Tertutup dan Kembali ke Katalog
- assertNotVisible: "Hapus Box dari Sistem?"
- assertVisible: "Katalog Box Gudang"

# Ambil Bukti Screenshot Pengujian
- takeScreenshot: screenshots/hasil_uji_fitur_hapus
