appId: com.warehouse.box_management_system
---
# ==============================================================================
# PENGUJIAN 1 FITUR: REGISTRASI & TAMBAH BOX GUDANG BARU (UAT-04)
# Cocok dijalankan langsung di Maestro Studio maupun CLI:
# maestro test maestro/uji_satu_fitur_tambah.yaml
# ==============================================================================

# 1. Buka Aplikasi
- launchApp:
    clearState: false

# 2. Otomatis Login Jika Berada di Layar Masuk
- runFlow:
    when:
      visible: "Masuk Sekarang"
    commands:
      - tapOn: "Isi Akun Demo Cepat"
      - tapOn: "Masuk Sekarang"

# 3. Pastikan Berada di Layar Katalog Box Gudang
- assertVisible: "Katalog Box Gudang"

# 4. Ketuk Tombol 'Tambah Box Baru' di Pojok Kanan Bawah
- tapOn: "Tambah Box Baru"

# 5. Verifikasi Layar Form Registrasi Box Terbuka
- assertVisible: "Registrasi Box Baru"
- assertVisible: "Identitas Box Gudang"

# 6. Tekan Tombol 'Acak' untuk Mengenerate Kode Box Otomatis
- tapOn: "Acak"

# 7. Isi Nama / Deskripsi Box
- tapOn:
    hintText: "Misal: Kardus Kemasan Ekspor Medium"
- inputText: "Kardus Sparepart Motor Matic"

# 8. Isi Dimensi Panjang, Lebar, dan Tinggi
- tapOn:
    below: "Panjang (L)"
- eraseText
- inputText: "40"

- tapOn:
    below: "Lebar (W)"
- eraseText
- inputText: "30"

- tapOn:
    below: "Tinggi (H)"
- eraseText
- inputText: "20"

# 9. Verifikasi Estimasi Volume Terkalkulasi Otomatis (24.00 Liter)
- assertVisible: ".*24.00 Liter.*"

# 10. Scroll ke Bagian Lokasi & Stok
- scrollUntilVisible:
    element: "Simpan Box & Generate QR Code"
    direction: DOWN

# 11. Isi Lokasi Rak
- tapOn:
    hintText: "Misal: Rak A-02, Pallet 4, Bay 10"
- eraseText
- inputText: "Rak C-05"

# 12. Simpan Data Box Baru
- tapOn: "Simpan Box & Generate QR Code"

# 13. Verifikasi Popup QR Code Otomatis Muncul
- assertVisible: "Warehouse QR Identifier"
- assertVisible: "Kardus Sparepart Motor Matic"

# 14. Tutup Dialog QR Code untuk Kembali ke Katalog
- takeScreenshot: screenshots/hasil_uji_fitur_tambah
- back

# 15. Verifikasi Berhasil Kembali ke Katalog Box Gudang
- assertVisible: "Katalog Box Gudang"
