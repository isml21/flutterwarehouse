appId: com.warehouse.box_management_system
---
# ==============================================================================
# PENGUJIAN 4: FITUR HAPUS ITEM / BOX & MODAL KEAMANAN
# (UAT-09, UAT-10, TC-BOX-06, TC-BOX-07)
# ==============================================================================

# 1. Pastikan Aplikasi Berjalan & Terotentikasi
- launchApp:
    clearState: false

- runFlow:
    when:
      visible: "Masuk Sekarang"
    commands:
      - tapOn: "Isi Akun Demo Cepat"
      - tapOn: "Masuk Sekarang"

- assertVisible: "Katalog Box Gudang\nismlfkrn21@gmail.com"

# ------------------------------------------------------------------------------
# A. Pembatalan Hapus Box / Batal Hapus (Negative Flow / Human Error Prevention)
# ------------------------------------------------------------------------------
# Ketuk ikon tong sampah pada kartu box pertama
- tapOn:
    text: "Hapus Item / Box"
    index: 0


# Ketuk Tombol 'Batal'
- tapOn: "Batal"

# Verifikasi Dialog Tertutup dan Box Tetap Utuh di Katalog
- assertNotVisible: "Hapus Box dari Sistem?"
- assertVisible: "Katalog Box Gudang\nismlfkrn21@gmail.com"

# ------------------------------------------------------------------------------
# B. Konfirmasi Hapus Box Secara Permanen (Positive Flow / Database Cascade)
# ------------------------------------------------------------------------------
# Ketuk kembali ikon tong sampah pada kartu box pertama
- tapOn:
    text: "Hapus Item / Box"
    index: 0

# Ketuk Tombol 'Hapus Box' di Bawah Teks Peringatan
- tapOn:
    text: "Hapus Box"
    below: ".*permanen.*"

# Verifikasi Dialog Tertutup dan Pengguna Berada di Katalog
- assertNotVisible: "Hapus Box dari Sistem?"
- assertVisible: "Katalog Box Gudang\nismlfkrn21@gmail.com"
# Ambil Bukti Screenshot Pengujian
- takeScreenshot: screenshots/04_hapus_box_success

