appId: com.warehouse.box_management_system
---
# ==============================================================================
# TEST SCENARIO: TS-02 PENCARIAN & FILTER KATALOG BOX
# UAT Reference: TC-BOX-03, TC-BOX-04, TC-BOX-05
# ==============================================================================

# 1. Pastikan Petugas Sudah Login
- runFlow: subflows/login.yaml

- assertVisible: "Katalog Box Gudang"

# ------------------------------------------------------------------------------
# TC-BOX-03: Pencarian Realtime (Search Bar)
# ------------------------------------------------------------------------------
- tapOn:
    hintText: "Cari Box Code, Nama, atau Lokasi..."
- inputText: "Rak B-02"

# Verifikasi box dengan lokasi 'Rak B-02' tampil
- assertVisible: "Rak B-02"

# Bersihkan Pencarian
- tapOn:
    hintText: "Cari Box Code, Nama, atau Lokasi..."
- eraseText

# ------------------------------------------------------------------------------
# TC-BOX-04: Filter Status Stok (Filter Chips)
# ------------------------------------------------------------------------------
# 1. Filter In Stock
- tapOn: "In Stock"

# 2. Filter Low Stock
- tapOn: ".*Low Stock.*"

# 3. Filter Out of Stock
- tapOn: ".*Out of Stock.*"

# 4. Kembalikan ke Semua
- tapOn: ".*Semua.*"

# ------------------------------------------------------------------------------
# TC-BOX-05: Buka Dialog QR Code dari Kartu Box
# ------------------------------------------------------------------------------
- tapOn: "QR Code"
- assertVisible: "Warehouse QR Identifier"
- assertVisible: ".*UUID:.*"

# Tutup Dialog
- takeScreenshot: screenshots/03_search_filter_success
- back
- assertVisible: "Katalog Box Gudang"
