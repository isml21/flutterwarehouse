appId: com.warehouse.box_management_system
---
# ==============================================================================
# PENGUJIAN 2: REGISTRASI BOX BARU, KALKULASI VOLUME & PENCARIAN
# (TC-BOX-01 s/d TC-BOX-05)
# ==============================================================================

# 1. Pastikan Aplikasi Berjalan & Terotentikasi
- launchApp:
    clearState: false

- runFlow:
    when:
      visible: "Masuk Sekarang"
    commands:
      - tapOn: "Isi Akun Demo Cepat"
      - tapOn: "Masuk Sekarang"

- assertVisible: "Katalog Box Gudang\nismlfkrn21@gmail.com"

# ------------------------------------------------------------------------------
# A. Registrasi Box Baru & Kalkulasi Volume Otomatis
# ------------------------------------------------------------------------------
# Buka Form Tambah Box
- tapOn: "Tambah Box Baru"
- assertVisible: "Registrasi Box Baru"
- assertVisible: "Identitas Box Gudang"

# Acak Kode Box
- tapOn: "Acak"

# Isi Nama Box
- tapOn: "Misal: Kardus Kemasan Ekspor Medium"
- inputText: "Box Sparepart Mesin Industri"

- hideKeyboard

# Masukkan Panjang (L)
- tapOn: "30"
- eraseText
- inputText: "40"

# Masukkan Lebar (W)
- tapOn: "20"
- eraseText
- inputText: "30"

# Masukkan Tinggi (H)
- tapOn: "15"
- eraseText
- inputText: "20"

# Verifikasi Live Volume Preview
- assertVisible: ".*24.00 Liter.*"

# Scroll ke Bagian Lokasi & Stok
- hideKeyboard
- scrollUntilVisible:
    element: "Simpan Box & Generate QR Code"
    direction: DOWN

# Input Lokasi Rak
- tapOn: "Rak A-01"
- eraseText
- inputText: "Rak B-04"

# Simpan Box Baru
- hideKeyboard
- tapOn: "Simpan Box & Generate QR Code"

# Verifikasi Modal QR Code Berhasil Terbit
- tapOn: "Tutup"

# Tutup Dialog QR Code
- tapOn: "Katalog Box Gudang\nismlfkrn21@gmail.com"
# ------------------------------------------------------------------------------
# B. Pencarian & Filter Status Stok Katalog
# ------------------------------------------------------------------------------
# Cari Box Berdasarkan Lokasi Rak
- tapOn: "Cari Box Code, Nama, atau Lokasi..."
- inputText: "Rak B-04"
- assertVisible: "Rak B-04"

# Bersihkan Pencarian
- tapOn: "Rak B-04"
- eraseText

# Uji Filter Status Stok
- tapOn: "In Stock"
- tapOn: ".*Low Stock.*"
- tapOn: ".*Semua.*"
- takeScreenshot: screenshots/02_katalog_tambah_box_success