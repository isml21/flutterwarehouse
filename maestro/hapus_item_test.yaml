appId: com.warehouse.box_management_system
---
- launchApp:
    clearState: false

# Pastikan login jika belum
- runFlow:
    when:
      visible: "Masuk Sekarang"
    commands:
      - tapOn: "Isi Akun Demo Cepat"
      - tapOn: "Masuk Sekarang"

# 1. Menekan Tombol Hapus pada salah satu kartu box di katalog
- tapOn: "Hapus Item / Box"

# 2. Memastikan Dialog Konfirmasi Hapus Glassmorphic muncul
- assertVisible: "Hapus Box dari Sistem?"
- assertVisible: ".*permanen.*"

# 3. Uji coba tombol Batal terlebih dahulu
- tapOn: "Batal"
- assertNotVisible: "Hapus Box dari Sistem?"

# 4. Membuka dialog hapus kembali untuk konfirmasi penghapusan
- tapOn: "Hapus Item / Box"
- assertVisible: "Hapus Box dari Sistem?"

# 5. Menekan tombol konfirmasi 'Hapus Box'
- tapOn: "Hapus Box"

# 6. Memverifikasi Notifikasi Sukses Penghapusan
- assertVisible: ".*berhasil dihapus.*"
