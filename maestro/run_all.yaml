appId: com.warehouse.box_management_system
---
# ==============================================================================
# MASTER SUITE: PENGUJIAN OTOMATIS END-TO-END MYWAREHOUSE (MAESTRO)
# Menggabungkan 4 Pengujian Inti Aplikasi:
# 1. 01_auth_test.yaml              -> Autentikasi & Validasi Form Login
# 2. 02_katalog_tambah_box_test.yaml -> Registrasi Box, Volume & Pencarian
# 3. 03_transaksi_stok_qr_test.yaml  -> Transaksi Stok IN/OUT & Scanner QR
# 4. 04_hapus_box_test.yaml          -> Fitur Hapus Box & Dialog Keamanan
# ==============================================================================

# 1. Alur Autentikasi & Validasi Login
- runFlow: 01_auth_test.yaml

# 2. Alur Registrasi Box Baru & Pencarian Katalog
- runFlow: 02_katalog_tambah_box_test.yaml

# 3. Alur Transaksi Stok & Scanner QR Code
- runFlow: 03_transaksi_stok_qr_test.yaml

# 4. Alur Hapus Item/Box & Dialog Keamanan
- runFlow: 04_hapus_box_test.yaml
